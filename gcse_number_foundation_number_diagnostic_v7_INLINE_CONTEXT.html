<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GCSE Maths (Foundation) — Number Topic Preview (N1–N50)</title>
<style>
  :root{
    --ink:#0f172a; --muted:#6b7280; --accent:#2563eb; --bg:#ffffff; --border:#e5e7eb;
    --green:#16a34a; --orange:#f59e0b; --red:#dc2626;
    --fbar:1px; /* ultra-thin fraction bar */
  }

  html,body{
    margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:19px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  }

  header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border)}
  main{max-width:1040px;margin:1.2rem auto 4rem;padding:0 1rem}

  /* top control bar (simple, no tabs) */
  .bar{
    display:flex;gap:.65rem;align-items:center;flex-wrap:wrap;
    padding:.75rem .9rem
  }
  .bar .group{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .bar label{font-weight:900;color:#111827;font-size:1rem}
  select, input[type="text"], input[type="number"]{
    padding:.55rem .65rem;border:1px solid var(--border);border-radius:.6rem;min-width:160px;
    background:#fff;color:var(--ink);font-size:1rem
  }
  input[type="text"], input[type="number"]{min-width:160px}
  .primary{
    background:var(--accent);color:#fff;border:1px solid var(--accent);
    border-radius:.65rem;padding:.6rem 1.05rem;cursor:pointer;font-weight:900;font-size:1rem
  }
  .ghost{
    background:#fff;color:var(--ink);border:1px solid var(--border);
    border-radius:.65rem;padding:.6rem 1.05rem;cursor:pointer;font-weight:900;font-size:1rem
  }
  .muted{color:var(--muted);font-size:1rem}
  .spacer{flex:1}
  .actions{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}

  /* question panel */
  .qpanel{border:1px solid var(--border);border-radius:1rem;overflow:hidden;margin-top:1rem;
    box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .qhead{
    padding:1rem 1.05rem;border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#fbfdff,#f8fafc);
    display:flex;align-items:center;justify-content:space-between;gap:.7rem;flex-wrap:wrap
  }
  .qhead h3{margin:.1rem 0;font-size:1.2rem}
  .qbody{padding:1.1rem 1.05rem}
  .badge{display:inline-block;margin-left:.55rem;padding:.08rem .5rem;border:1px solid var(--border);
    border-radius:8px;background:#eef2ff;font-size:.95rem}
  .nc-tag{font-weight:900;text-transform:uppercase;letter-spacing:.02em;font-size:.95rem}
  .nc{color:#15803d}
  .calc{color:#1d4ed8}

  /* question lines */
  .item{padding:.6rem .1rem;border-bottom:1px dashed rgba(229,231,235,.9)}
  .item:last-child{border-bottom:none}
  .line{
    display:flex;align-items:flex-start;gap:.75rem;flex-wrap:wrap;
  }
  .qtext{flex:1;min-width:280px}
  .endmark{margin-left:.4rem;font-weight:900;color:#334155}

  .hlDigit{background:rgba(245,158,11,.25);border:1px solid rgba(245,158,11,.45);border-radius:.25rem;padding:0 .2rem;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  .sfhint{font-size:.85rem;color:#64748b;margin-top:.35rem;max-width:520px}

  /* inputs - feedback highlighting */
  .ok{outline:2px solid rgba(22,163,74,.35); border-color:rgba(22,163,74,.55)!important}
  .bad{outline:2px solid rgba(220,38,38,.28); border-color:rgba(220,38,38,.55)!important}

  /* fraction widget */
  .frac{display:inline-grid;grid-template-rows:auto 0 auto;row-gap:0;align-items:center;justify-items:center;line-height:0;vertical-align:middle}
  .frac input{
    width:92px;text-align:center;border:1px solid var(--border);border-radius:.45rem;padding:.45rem .5rem;margin:0;
    appearance:textfield;font-size:1rem;min-width:0
  }
  .frac input::-webkit-outer-spin-button,.frac input::-webkit-inner-spin-button{appearance:none;margin:0}
  .frac .bar{width:92px;height:0;border-top:var(--fbar) solid #111;margin:16px 0 0 0}
  .frac input:last-child{margin-top:-2px}

  /* pair/triple widgets */
  .twobox, .threebox, .sfbox{
    display:inline-flex;gap:.5rem;align-items:center;flex-wrap:wrap
  }
  .twobox input, .threebox input, .sfbox input{
    min-width:120px
  }
  .mini{min-width:110px!important}
  .tiny{min-width:90px!important}


  /* standard form input (no ^) */
  .sfTen{font-weight:900}
  .sfexp{
    vertical-align:super;
    font-size:.85rem;
    min-width:72px!important;
    width:72px;
    padding:.22rem .3rem;
  }

  /* prime factorisation input (EXP toggles superscripts) */
  .pfbox{
    min-height:44px;
    border:1px solid var(--border);
    border-radius:.55rem;
    padding:.45rem .55rem;
    background:#fff;
    font-weight:850;
    letter-spacing:.01em;
    line-height:1.2;
  }
  .pfbox sup{font-size:.75em;vertical-align:super}
  .pfbox .mul{opacity:.9;padding:0 .12rem}
  .kbtn.on{
    background:#2563eb;
    border-color:#2563eb;
    color:#fff;
  }

  /* prime factors keypad */
  .pfwrap{display:flex;flex-direction:column;gap:.5rem;min-width:320px}
  .keypad{display:flex;gap:.45rem;flex-wrap:wrap}
  .kbtn{
    border:1px solid var(--border);background:#fff;border-radius:.6rem;
    padding:.4rem .7rem;cursor:pointer;font-weight:900;font-size:1rem
  }
  .kbtn:active{transform:translateY(1px)}
  .kbtn.accent{border-color:rgba(37,99,235,.35);background:#eef2ff}

  /* feedback */
  .feedback{margin-top:1rem;border:1px solid var(--border);border-radius:.75rem;padding:.85rem 1rem;background:#f8fafc}
  .feedback.good{background:#ecfdf5;border-color:rgba(22,163,74,.22);color:#065f46}
  .feedback.bad{background:#fef2f2;border-color:rgba(220,38,38,.22);color:#7f1d1d}

  .mathwrap{display:inline-block;vertical-align:middle}

  /* -------------------- drag ordering widget -------------------- */
  .drag-order{
    margin:.6rem 0 .1rem 0;
    padding:.6rem .65rem;
    border:1px solid var(--border);
    border-radius:1rem;
    background:linear-gradient(180deg,#ffffff,#f8fafc);
  }
  .drag-bank, .drag-targets{
    display:flex;
    gap:.5rem;
    flex-wrap:wrap;
    align-items:center;
  }
  .drag-bank{
    padding:.5rem;
    border:1px solid var(--border);
    border-radius:.85rem;
    background:#fff;
  }
  .drag-targets{
    margin-top:.55rem;
    padding:.5rem;
    border:1px dashed rgba(107,114,128,.35);
    border-radius:.85rem;
    background:#f8fafc;
    min-height:56px;
  }
  .dragbox{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:.35rem .65rem;
    border:1px solid var(--border);
    border-radius:.7rem;
    background:#fff;
    cursor:grab;
    font-weight:900;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }
  .dragbox:active{ cursor:grabbing; }
  .dragbox.dragging{ opacity:.55; }
  .dragbox.selected{
    outline:2px solid rgba(37,99,235,.45);
    border-color:rgba(37,99,235,.55);
  }
  .dropbox{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:92px;
    min-height:46px;
    padding:.2rem .35rem;
    border:2px dashed rgba(229,231,235,.95);
    border-radius:.7rem;
    background:#fff;
  }
  .dropbox.over{
    border-color:rgba(37,99,235,.65);
    background:#eff6ff;
  }
  .dropbox .dragbox{ cursor:grab; }

  .drag-instr{
    margin-top:.45rem;
    color:var(--muted);
    font-size:1rem;
  }

  .dragbox math{ font-size:1.05em; }

  /* -------------------- standard form (single box + EXP keypad) -------------------- */
  .sfwrap{
    display:flex;
    flex-direction:column;
    gap:.55rem;
    min-width:320px;
  }
  .sfinput{
    padding:.55rem .65rem;
    border:1px solid var(--border);
    border-radius:.6rem;
    background:#fff;
    color:var(--ink);
    font-size:1rem;
    min-width:240px;
  }
  .sfhint{
    color:var(--muted);
    font-size:1rem;
  }

  @media (max-width:560px){
    .dropbox{ min-width:78px; }
    .sfwrap{ min-width:260px; }
  }

</style>

<body>

<header>
  <div class="bar">
    <div class="group">
      <label for="topicSel">Topic</label>
      <select id="topicSel"></select>
    </div>

    <div class="group">
      <label for="marksSel">Marks</label>
      <select id="marksSel">
        <option value="1">1 mark</option>
        <option value="2">2 marks</option>
        <option value="3">3 marks</option>
        <option value="4">4 marks</option>
        <option value="5">5 marks</option>
      </select>
    </div>

    <div class="group">
      <label for="calcSel">Paper</label>
      <select id="calcSel">
        <option value="noncalc">Non-calculator</option>
        <option value="calc">Calculator</option>
      </select>
    </div>

    <div class="spacer"></div>

    <div class="actions">
      <button class="primary" id="regenBtn" type="button">Regenerate numbers</button>
      <button class="ghost" id="checkBtn" type="button">Check</button>
      <button class="ghost" id="revealBtn" type="button">Reveal answers</button>
    </div>
  </div>
</header>

<main>
  <section id="preview"></section>
  <div class="feedback" id="fb" style="display:none"></div>
</main>

<script>
/* ============================================================
   GCSE (Foundation) Number Question Preview Tool (N1–N50)
   - NO ratio topics.
   - NO recurring decimals.
   - Finer-grained topics (each N code is a single narrow topic).
   - Marks selector gives a question that is worth those marks:
       higher marks => more steps / more answer boxes / more structure,
       not just “same question with bigger numbers”.
   - Calculator mode uses calculator-suitable numbers (messier decimals, awkward divisions),
     and where needed asks for answers to 2 decimal places.
   ============================================================ */

/* -------------------- seeded RNG -------------------- */
function hashToUint32(str){
  let h = 2166136261 >>> 0;
  for (let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function cryptoSeed(){
  if (window.crypto && crypto.getRandomValues){
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] >>> 0;
  }
  return (Math.random()*2**32)>>>0;
}
function mulberry32(seed){
  let t = seed >>> 0;
  return function(){
    t += 0x6D2B79F5;
    let x = t;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seedLike){
  const seed = (seedLike===undefined || seedLike===null || seedLike==="")
    ? cryptoSeed()
    : (typeof seedLike==="number" ? (seedLike>>>0) : hashToUint32(String(seedLike)));
  const r = mulberry32(seed);
  return {
    seed,
    float: ()=>r(),
    int: (min,max)=>{
      min=Math.ceil(min); max=Math.floor(max);
      return Math.floor(r()*(max-min+1))+min;
    },
    choice: (arr)=>arr[Math.floor(r()*arr.length)],
    shuffle: (arr)=>{
      const a=arr.slice();
      for(let i=a.length-1;i>0;i--){
        const j=Math.floor(r()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      return a;
    }
  };
}

/* -------------------- helpers -------------------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
function lcm(a,b){ return Math.abs(a*b)/gcd(a,b); }
function roundTo(x, dp){
  const f = 10**dp;
  return Math.round((+x + Number.EPSILON)*f)/f;
}
function fmt(x, maxDp=6){
  const n = Number(x);
  if(!Number.isFinite(n)) return String(x);
  const s = n.toFixed(maxDp);
  return s.replace(/\.?0+$/,"");
}
function simpFrac(n,d){
  if(d===0) return {n:NaN,d:NaN};
  if(d<0){n=-n;d=-d}
  const g=gcd(n,d);
  return {n:n/g,d:d/g};
}
function fracEq(a,b){
  const x=simpFrac(a.n,a.d), y=simpFrac(b.n,b.d);
  return x.n===y.n && x.d===y.d;
}
function asNum(v){
  const s = String(v??"").trim().replace(/,/g,"");
  if(!s) return NaN;
  // allow fraction "a/b" in numeric fields
  if(s.includes("/")){
    const m = s.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
    if(!m) return NaN;
    const n=Number(m[1]), d=Number(m[2]);
    if(!Number.isFinite(n)||!Number.isFinite(d)||d===0) return NaN;
    return n/d;
  }
  // allow leading +, decimals
  const x = Number(s);
  return Number.isFinite(x) ? x : NaN;
}
function close(a,b,tol=1e-8){ return Math.abs(a-b) <= tol; }

function parseStandardFormInput(raw){
  // Accept forms like:
  // 3.2×10⁵   3.2x10^5   3.2E5   3.2×10-5  (Unicode superscripts supported)
  const s0 = String(raw ?? "").trim();
  if(!s0) return null;

  // Normalise
  let s = s0.replace(/\s+/g,"");
  s = s.replace(/×/g,"x").replace(/⋅/g,"x").replace(/·/g,"x");
  s = s.replace(/EXP/ig,"E");
  s = s.replace(/[−–—]/g,"-"); // unicode minus/dashes

  // Convert Unicode superscripts to normal digits/sign
  const supMap = {"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"-","⁺":"+"};
  s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]/g, ch => supMap[ch] ?? ch);

  // Standardise multiply symbol
  s = s.replace(/X/g,"x");

  // Pattern A: mantissa E exponent
  let m = s.match(/^([+-]?\d*\.?\d+)E([+-]?\d+)$/i);
  if(m){
    const mantissa = Number(m[1]);
    const exp = parseInt(m[2],10);
    if(!Number.isFinite(mantissa) || !Number.isFinite(exp)) return null;
    return {mantissa, exp, value: mantissa * Math.pow(10, exp)};
  }

  // Pattern B: mantissa × 10 ^ exponent  (caret optional, exponent may follow immediately after 10)
  m = s.match(/^([+-]?\d*\.?\d+)(?:x|\*)10\^?([+-]?\d+)$/i);
  if(m){
    const mantissa = Number(m[1]);
    const exp = parseInt(m[2],10);
    if(!Number.isFinite(mantissa) || !Number.isFinite(exp)) return null;
    return {mantissa, exp, value: mantissa * Math.pow(10, exp)};
  }

  return null;
}


/* -------------------- MathML helpers -------------------- */
const MNS = `http://www.w3.org/1998/Math/MathML`;
function mfrac(n,d){
  return `<span class="mathwrap"><math xmlns="${MNS}" display="inline"><mfrac><mn>${n}</mn><mn>${d}</mn></mfrac></math></span>`;
}
function msup(base, exp){
  const baseNode = Number.isFinite(+base) ? `<mn>${base}</mn>` : `<mi>${String(base)}</mi>`;
  return `<span class="mathwrap"><math xmlns="${MNS}" display="inline"><msup>${baseNode}<mn>${exp}</mn></msup></math></span>`;
}

/* -------------------- topic list (finer-grained) -------------------- */
const TOPICS = [
  {code:"N1",  name:"Ordering integers (incl. negatives)"},
  {code:"N2",  name:"Ordering decimals"},
  {code:"N3",  name:"Inequalities (integer solutions)"},
  {code:"N4",  name:"Place value & powers of 10"},
  {code:"N5",  name:"Addition (integers & decimals)"},
  {code:"N6",  name:"Subtraction (integers & decimals)"},
  {code:"N7",  name:"Multiplication (integers & decimals)"},
  {code:"N8",  name:"Division (integers & decimals)"},
  {code:"N9",  name:"Negative numbers (mixed operations)"},
  {code:"N10", name:"Order of operations (BIDMAS)"},
  {code:"N11", name:"Inverse operations & missing numbers"},
  {code:"N12", name:"Factors & multiples"},
  {code:"N13", name:"Prime numbers"},
  {code:"N14", name:"Highest common factor (HCF)"},
  {code:"N15", name:"Lowest common multiple (LCM)"},
  {code:"N16", name:"LCM in context"},
  {code:"N17", name:"Prime factorisation (index form)"},
  {code:"N18", name:"Squares & cubes"},
  {code:"N19", name:"Square & cube roots"},
  {code:"N20", name:"Index laws (integer indices)"},
  {code:"N21", name:"Simplifying fractions"},
  {code:"N22", name:"Adding fractions"},
  {code:"N23", name:"Subtracting fractions"},
  {code:"N24", name:"Multiplying fractions"},
  {code:"N25", name:"Dividing fractions"},
  {code:"N26", name:"Fraction of an amount"},
  {code:"N27", name:"Reverse fractions (find the whole)"},
  {code:"N28", name:"Fractions → decimals"},
  {code:"N29", name:"Decimals → fractions"},
  {code:"N30", name:"Percentage of an amount"},
  {code:"N31", name:"Ordering fractions"},
  {code:"N32", name:"HCF in context"},
  {code:"N33", name:"Decimals → percentages"},
  {code:"N34", name:"Percentages → decimals"},
  {code:"N35", name:"Fractions → percentages"},
  {code:"N36", name:"Percentages → fractions"},
  {code:"N37", name:"Standard form (convert & normalise)"},
  {code:"N38", name:"Standard form multiplication"},
  {code:"N39", name:"Standard form division"},
  {code:"N40", name:"Estimation (round then calculate)"},
  {code:"N41", name:"Rounding (decimal places)"},
  {code:"N42", name:"Rounding (significant figures)"},
  {code:"N43", name:"Error intervals (bounds)"},
  {code:"N44", name:"Bounds in calculations (upper/lower)"},
  {code:"N45", name:"Unit conversions (metric)"},
  {code:"N46", name:"Compound measures (speed / density)"},
  {code:"N47", name:"Money calculations (multi-step)"},
  {code:"N48", name:"Time calculations"},
  {code:"N49", name:"Standard form addition"},
  {code:"N50", name:"Standard form subtraction"}
];

/* -------------------- number pickers -------------------- */
function pickDec(rng, dp){
  // dp digits after decimal, always non-trailing safe
  const m = 10**dp;
  return rng.int(1*m, 999*m)/m;
}
function pickMoney(rng, isCalc){
  // money prices: noncalc => 2 dp but friendly; calc => awkward 2 dp
  const pennies = isCalc ? rng.int(105, 2999) : rng.choice([125,150,175,200,225,250,275,300,350,400,450,500,550,600,650,700,750,800,900,1000,1200,1500]);
  return pennies/100;
}
function pickNiceInt(rng, min=2, max=40){ return rng.int(min, max); }
function pickBigInt(rng){ return rng.int(1200, 98000); }

function pickPercent(rng, allowOneDp=false){
  // GCSE-friendly percentages (no recurring). If allowOneDp, may return values like 12.5 or 7.5.
  const ints = [1,2,3,4,5,6,8,10,12,15,18,20,25,30,35,40,45,50,60,75,80,90];
  const oneDp = [2.5,7.5,12.5,17.5,22.5,37.5,62.5];
  return allowOneDp ? rng.choice(ints.concat(oneDp)) : rng.choice(ints);
}

/* -------------------- part constructors -------------------- */
function partNumber(id, textHtml, marks, value){
  return {marks, textHtml, input:{kind:"number", id}, answer:{type:"number", value}};
}
function partInteger(id, textHtml, marks, value){
  return {marks, textHtml, input:{kind:"integer", id}, answer:{type:"number", value}};
}
function partFraction(id, textHtml, marks, frac){
  return {marks, textHtml, input:{kind:"fraction", id}, answer:{type:"fraction", value: frac}};
}
function partPair(id, textHtml, marks, pair, opts={}){
  return {marks, textHtml, input:{kind:(opts.kind||"pair"), id, placeholders:opts.placeholders, labels:opts.labels}, answer:{type:"pair", value: pair}};
}
function partStdForm(id, textHtml, marks, val, nMaybe){
  // val can be:
  //  - the actual numeric value to be written in standard form, OR
  //  - (A, n) where val is A and nMaybe is the power of 10.
  const num = (typeof nMaybe !== "undefined")
    ? (Number(val) * (10**Number(nMaybe)))
    : Number(val);
  return {marks, textHtml, input:{kind:"standardForm", id}, answer:{type:"standardForm", value: num}};
}
function partOrder(id, textHtml, marks, correctTokens){
  return {marks, textHtml, input:{kind:"order", id}, answer:{type:"order", value: correctTokens}};
}
function partPrimeFactors(id, textHtml, marks, primeMap){
  // primeMap: {2:3, 3:1, ...}
  return {marks, textHtml, input:{kind:"primeFactors", id}, answer:{type:"primeFactors", value: primeMap}};
}
function partMoney(id, textHtml, marks, value){
  return {marks, textHtml, input:{kind:"money", id}, answer:{type:"number", value}};
}

function partSymbol(id, textHtml, marks, value){
  return {marks, textHtml, input:{kind:"symbol", id}, answer:{type:"symbol", value}};
}

/* -------------------- prime factor helpers -------------------- */
function factorise(n){
  // returns map {p:exp}, n is integer >=2
  let x = Math.abs(Math.trunc(n));
  const map = {};
  let p = 2;
  while(p*p <= x){
    while(x % p === 0){
      map[p] = (map[p]||0) + 1;
      x = Math.trunc(x/p);
    }
    p = (p===2) ? 3 : p+2;
  }
  if(x>1) map[x] = (map[x]||0)+1;
  return map;
}
function mapsEqual(a,b){
  const ka = Object.keys(a).sort();
  const kb = Object.keys(b).sort();
  if(ka.length!==kb.length) return false;
  for(let i=0;i<ka.length;i++){
    if(ka[i]!==kb[i]) return false;
    if(a[ka[i]]!==b[kb[i]]) return false;
  }
  return true;
}

/* -------------------- build question per topic -------------------- */
function buildQuestion(topicCode, marksTotal, paperMode, rng){
  const isCalc = paperMode === "calc";

  // helper: scenario/context variants (3+ marks only)
  const contextVariants = (code)=>{
    switch(code){
      case "N7":
      case "N47":
        return [
        "A customer is buying items in a local shop.",
        "A group is buying tickets and snacks at a cinema.",
        "A charity stall is selling items to raise money."
        ];
      case "N46":
        return [
        "A cyclist records a distance and the time taken for a journey.",
        "A driver records a distance and the time taken for a trip.",

  // helper: create object

              const idx = original.toLowerCase().indexOf('<p');

            } else {

      const dpRange = 3; // use thousandths

      const makeDecimals = (count)=>{
        // Mixed structure (Foundation diagnostic): include negatives & positives and a mix of 1, 2 and 3 decimal places.
        for (let attempt=0; attempt<80; attempt++){
          const seen = new Set();
          const nums = [];

          while (dpBag.length < count) dpBag.push(rng.choice([1,2,3]));
          rng.shuffle(dpBag);

          const signBag = (count===2) ? [-1, +1] : (()=>{ const a=[-1,+1]; while(a.length<count) a.push(rng.choice([-1,+1])); return rng.shuffle(a); })();

          const makeOne = (sign, dp)=>{
            const ip = sign < 0 ? ipNeg : ipPos;

        ),

          `Work out <b>(second largest − second smallest)</b>. Give your answer to <b>${dpRange} decimal places</b>. <span class="endmark">[2]</span>`,

        ),

    case "N3": {

      if(marksTotal===2){

    case "N4": {

      const hlClass = "hlDigit";

        if(useDec){
          const frac = rng.int(0, 999); // thousandths
          s += "." + String(frac).padStart(3, "0");
        }

        // pick a digit position (not the dot), ideally a digit that appears once
        const digitPositions = [];
        for(let i=0;i<s.length;i++){
          if(s[i] !== ".") digitPositions.push(i);
        }

        // try to find a unique digit
        for(let t=0;t<300;t++){
          const idx = rng.choice(digitPositions);
          const d = s[idx];
          const count = s.replace(".","").split("").filter(ch=>ch===d).length;
          if(count === 1){
            const dot = s.indexOf(".");
            const dotPos = dot === -1 ? s.length : dot;

            let place;
            if(idx < dotPos){
              const p = (dotPos - 1) - idx; // ones=0, tens=1, ...
              place = Math.pow(10, p);
            } else {
              const p = idx - dotPos; // tenths=1, hundredths=2, thousandths=3
              place = Math.pow(10, -p);
            }

            const digit = parseInt(d, 10);
            const value = roundTo(digit * place, 6);
            const html = s.slice(0, idx) + `<span class="${hlClass}">${d}</span>` + s.slice(idx+1);

            return {s, html, idx, digit, place, value};
          }
        }

        // fallback: just take the first digit position
        const idx = digitPositions[0];
        const d = s[idx];
        const dot = s.indexOf(".");
        const dotPos = dot === -1 ? s.length : dot;
        let place = (idx < dotPos)
          ? Math.pow(10, (dotPos - 1) - idx)
          : Math.pow(10, -(idx - dotPos));
        const digit = parseInt(d, 10);
        const value = roundTo(digit * place, 6);
        const html = s.slice(0, idx) + `<span class="${hlClass}">${d}</span>` + s.slice(idx+1);
        return {s, html, idx, digit, place, value};
      };

      if(marksTotal===1){
        const n = makePV();
        return Q([
          partNumber(
            "n4_1",
            `In the number <b>${n.html}</b>, what is the <b>place value</b> of the highlighted digit?<br>`+
            `Write your answer as a number (e.g. 100, 0.01). <span class="endmark">[1]</span>`,
            1,
            n.place
          )
        ]);
      }

      if(marksTotal===2){
        const a = makePV();
        const b = makePV();
        return Q([
          partNumber(
            "n4_2a",
            `In the number <b>${a.html}</b>, what is the <b>place value</b> of the highlighted digit? <span class="endmark">[1]</span>`,
            1,
            a.place
          ),
          partNumber(
            "n4_2b",
            `In the number <b>${b.html}</b>, what is the <b>place value</b> of the highlighted digit? <span class="endmark">[1]</span>`,
            1,
            b.place
          ),
        ]);
      }

      if(marksTotal===3){
        const n = makePV();
        const m = makePV();
        return Q([
          partNumber(
            "n4_3a",
            `In the number <b>${n.html}</b>, what is the <b>place value</b> of the highlighted digit? <span class="endmark">[1]</span>`,
            1,
            n.place
          ),
          partNumber(
            "n4_3b",
            `What is the <b>value</b> of the highlighted digit in <b>${n.html}</b>? <span class="endmark">[1]</span>`,
            1,
            n.value
          ),
          partNumber(
            "n4_3c",
            `In the number <b>${m.html}</b>, what is the <b>place value</b> of the highlighted digit? <span class="endmark">[1]</span>`,
            1,
            m.place
          ),
        ]);
      }

      if(marksTotal===4){
        // One number with TWO highlighted digits.
        const n = makePV();
        // pick a second different digit position
        const s = n.s;
        const positions = [];
        for(let i=0;i<s.length;i++) if(s[i] !== "." && i !== n.idx) positions.push(i);

        let idx2 = rng.choice(positions);
        // ensure second digit is also unique (best effort)
        for(let t=0;t<200;t++){
          const d2 = s[idx2];
          const count2 = s.replace(".","").split("").filter(ch=>ch===d2).length;
          if(count2 === 1) break;
          idx2 = rng.choice(positions);
        }

        const dot = s.indexOf(".");
        const dotPos = dot === -1 ? s.length : dot;

        const place2 = (idx2 < dotPos)
          ? Math.pow(10, (dotPos - 1) - idx2)
          : Math.pow(10, -(idx2 - dotPos));
        const digit2 = parseInt(s[idx2], 10);
        const value2 = roundTo(digit2 * place2, 6);

        // HTML with two highlights
        const i1 = Math.min(n.idx, idx2);
        const i2 = Math.max(n.idx, idx2);
        const html2 = s.slice(0, i1) +
          `<span class="${hlClass}">${s[i1]}</span>` +
          s.slice(i1+1, i2) +
          `<span class="${hlClass}">${s[i2]}</span>` +
          s.slice(i2+1);

        const diff = roundTo(Math.abs(n.value - value2), 6);

        return Q([
          partNumber(
            "n4_4a",
            `In the number <b>${html2}</b>, what is the place value of the <b>first</b> highlighted digit (reading left to right)? <span class="endmark">[1]</span>`,
            1,
            (n.idx < idx2 ? n.place : place2)
          ),
          partNumber(
            "n4_4b",
            `What is the place value of the <b>second</b> highlighted digit? <span class="endmark">[1]</span>`,
            1,
            (n.idx < idx2 ? place2 : n.place)
          ),
          partNumber(
            "n4_4c",
            `Work out the <b>difference</b> between the values of the two highlighted digits. <span class="endmark">[2]</span>`,
            2,
            diff
          ),
        ]);
      }

      // 5 MARKS
      const n = makePV();
      const placeAfterTimes10 = roundTo(n.place * 10, 12);
      const valueAfterTimes10 = roundTo(n.digit * placeAfterTimes10, 6);

      return Q([
        partNumber(
          "n4_5a",
          `In the number <b>${n.html}</b>, what is the <b>place value</b> of the highlighted digit? <span class="endmark">[1]</span>`,
          1,
          n.place
        ),
        partNumber(
          "n4_5b",
          `What is the <b>value</b> of the highlighted digit in <b>${n.html}</b>? <span class="endmark">[1]</span>`,
          1,
          n.value
        ),
        partNumber(
          "n4_5c",
          `The number is multiplied by <b>10</b>. What is the <b>place value</b> of the highlighted digit now? <span class="endmark">[1]</span>`,
          1,
          placeAfterTimes10
        ),
        partNumber(
          "n4_5d",
          `After multiplying by <b>10</b>, what is the <b>value</b> of the highlighted digit now? <span class="endmark">[2]</span>`,
          2,
          valueAfterTimes10
        ),
      ]);
    }

    /* ===================== N5 Addition ===================== */
    case "N5": {
      if(marksTotal<=3){
        // 1–3 marks: 1 mark each addition
        const parts=[];
        for(let i=1;i<=marksTotal;i++){
          const a = isCalc ? pickDec(rng,2) : rng.int(-50,50);
          const b = isCalc ? pickDec(rng,2) : rng.int(-50,50);
          const c = (marksTotal>=3 && i===marksTotal) ? (isCalc ? pickDec(rng,2) : rng.int(-50,50)) : null;
          const expr = c===null ? `${a} + ${b}` : `${a} + ${b} + ${c}`;
          const ans = c===null ? (a+b) : (a+b+c);
          parts.push(partNumber(`n5_${marksTotal}_${i}`, `Work out: <b>${expr}</b>. <span class="endmark">[1]</span>`, 1, isCalc?roundTo(ans,2):ans));
        }
        return Q(parts);
      }

      // 4–5 marks: split the list into TWO EQUAL halves (4 items or 6 items)
      const items = (marksTotal===4) ? 4 : 6; // 6 items for the 5-mark question
      const half = items/2;

      if(!isCalc){
        // NON-CALCULATOR: use whole-number amounts so answers are whole numbers
        const values = Array.from({length:items}, ()=> rng.int(8, 90));
        const listHtml = values.map((v,i)=>`Item ${i+1}: <b>${v}</b>`).join("<br>");
        const step1 = values.slice(0,half).reduce((s,x)=>s+x,0);
        const step2 = values.slice(half).reduce((s,x)=>s+x,0);
        const total = step1 + step2;

        return Q([
          partInteger("n5_45a", `Here are ${items} numbers:<br>${listHtml}<br><br>Work out the subtotal of the first half of the items <span class="endmark">[2]</span>`, 2, step1),
          partInteger("n5_45b", `Work out the subtotal of the second half of the items <span class="endmark">[${marksTotal===4?1:2}]</span>`, marksTotal===4?1:2, step2),
          partInteger("n5_45c", `Work out the total of all the items <span class="endmark">[1]</span>`, 1, total),
        ]);
      }

      // CALCULATOR: money totals (2 d.p.)
      const prices = Array.from({length:items}, ()=> pickMoney(rng,true));
      const listHtml = prices.map((p,i)=>`Item ${i+1}: £${p.toFixed(2)}`).join("<br>");
      const step1 = roundTo(prices.slice(0,half).reduce((s,p)=>s+p,0),2);
      const step2 = roundTo(prices.slice(half).reduce((s,p)=>s+p,0),2);
      const total = roundTo(step1 + step2,2);

      return Q([
        partNumber("n5c_45a", `A bill has these prices:<br>${listHtml}<br><br>Work out the subtotal of the first half of the items. Give your answer to <b>2 decimal places</b>. <span class="endmark">[2]</span>`, 2, step1),
        partNumber("n5c_45b", `Work out the subtotal of the second half of the items. Give your answer to <b>2 decimal places</b>. <span class="endmark">[${marksTotal===4?1:2}]</span>`, marksTotal===4?1:2, step2),
        partNumber("n5c_45c", `Work out the total cost of all the items. Give your answer to <b>2 decimal places</b>. <span class="endmark">[1]</span>`, 1, total),
      ]);
    }

    case "N6": {
      const need2dp = isCalc;
      const show2dp = (x)=> (need2dp ? Number(x).toFixed(2) : String(x));

      const makePair = ()=>{
        if(need2dp){
          let a = rng.int(2000, 9999)/100;
          let b = rng.int(100, 6500)/100;
          if(b>a){
            const t=a; a=b; b=t;
          }
          return [roundTo(a,2), roundTo(b,2)];
        }else{
          let a = rng.int(-50, 250);
          let b = rng.int(-50, 250);
          if(a===b) b += 1;
          return [a,b];
        }
      };

      if(marksTotal<=3){
        const parts = [];
        for(let i=0;i<marksTotal;i++){
          const [a,b] = makePair();
          const ans = need2dp ? roundTo(a-b,2) : (a-b);
          parts.push(partNumber(`n6_${marksTotal}_${i}`, `Work out: <b>${show2dp(a)}</b> − <b>${show2dp(b)}</b>.${need2dp ? " Give your answer to <b>2 decimal places</b>." : ""} <span class="endmark">[1]</span>`, 1, ans));
        }
        return Q(parts);
      }

      if(marksTotal===4){
        const [start, sub1] = makePair();
        let sub2 = makePair()[1];
        if(!need2dp && Math.abs(sub2)<5) sub2 += 12;

        const ans1 = need2dp ? roundTo(start - sub1, 2) : (start - sub1);
        const ans2 = need2dp ? roundTo(ans1 - sub2, 2) : (ans1 - sub2);

        return Q([
          partNumber("n6_4a", `First, work out: <b>${show2dp(start)}</b> − <b>${show2dp(sub1)}</b>.${need2dp ? " (2 d.p.)" : ""} <span class="endmark">[2]</span>`, 2, ans1),
          partNumber("n6_4b", `Then subtract <b>${show2dp(sub2)}</b> from your answer to part 1.${need2dp ? " (2 d.p.)" : ""} <span class="endmark">[2]</span>`, 2, ans2),
        ]);
      }

      // 5 marks: three linked subtractions
      const [start, sub1] = makePair();
      let sub2 = makePair()[1];
      let sub3 = makePair()[1];
      if(!need2dp){
        if(Math.abs(sub2)<5) sub2 += 9;
        if(Math.abs(sub3)<5) sub3 += 7;
      }

      const ans1 = need2dp ? roundTo(start - sub1, 2) : (start - sub1);
      const ans2 = need2dp ? roundTo(ans1 - sub2, 2) : (ans1 - sub2);
      const ans3 = need2dp ? roundTo(ans2 - sub3, 2) : (ans2 - sub3);

      return Q([
        partNumber("n6_5a", `Work out: <b>${show2dp(start)}</b> − <b>${show2dp(sub1)}</b>.${need2dp ? " (2 d.p.)" : ""} <span class="endmark">[2]</span>`, 2, ans1),
        partNumber("n6_5b", `Now subtract <b>${show2dp(sub2)}</b> from your previous answer.${need2dp ? " (2 d.p.)" : ""} <span class="endmark">[2]</span>`, 2, ans2),
        partNumber("n6_5c", `Finally, subtract <b>${show2dp(sub3)}</b> from your previous answer.${need2dp ? " (2 d.p.)" : ""} <span class="endmark">[1]</span>`, 1, ans3),
      ]);
    }

    case "N7": {
      // Multiplication
      if(!isCalc){
        // NON-CALCULATOR: integer answers only
        if(marksTotal<=2){
          const a = rng.int(2,25), b = rng.int(2,25);
          return Q([partInteger(`n7_${marksTotal}`, `Work out: <b>${a} × ${b}</b>. <span class="endmark">[${marksTotal}]</span>`, marksTotal, a*b)]);
        }

        const parts=[];
        for(let i=1;i<=marksTotal;i++){
          const a = rng.int(12, 999);
          const b = rng.int(2, 30);
          parts.push(partInteger(`n7_${marksTotal}_${i}`, `Work out: <b>${a} × ${b}</b>. <span class="endmark">[1]</span>`, 1, a*b));
        }
        return Q(parts);
      }

      // CALCULATOR: decimals allowed (round to 2 d.p. where needed)
      if(marksTotal<=2){
        const a=rng.int(2,25), b=rng.int(2,25);
        return Q([partNumber(`n7c_${marksTotal}`, `Work out: <b>${a} × ${b}</b>. <span class="endmark">[${marksTotal}]</span>`, marksTotal, a*b)]);
      }

      const parts=[];
      for(let i=1;i<=marksTotal;i++){
        const a = pickDec(rng,3);
        const b = rng.choice([0.2,0.25,0.3,0.4,0.5,0.75,1.2,1.5,2.5,3.2]);
        const ans = roundTo(a*b,2);
        parts.push(partNumber(`n7c_${marksTotal}_${i}`, `Work out: <b>${a} × ${b}</b>. Give your answer to <b>2 decimal places</b>. <span class="endmark">[1]</span>`, 1, ans));
      }
      return Q(parts);
    }

    case "N8": {
      if(marksTotal===1){
        const d = rng.choice([2,3,4,5,6,8,9,10,12]);
        const q = rng.int(3,18);
        const n = d*q;
        return Q([partInteger("n8_1", `Work out: <b>${n} ÷ ${d}</b>. <span class="endmark">[1]</span>`, 1, q)]);
      }
      if(marksTotal===2){
        const d = rng.choice([2,4,5,8,10,16,20]);
        const q = rng.int(3,30);
        const n = roundTo(d*q, 2);
        const instr = need2dp ? " Give your answer to <b>2 decimal places</b>." : "";
        return Q([partNumber("n8_2", `Work out: <b>${fmt(n)} ÷ ${d}</b>.${instr} <span class="endmark">[2]</span>`, 2, roundTo(n/d,6), {dp: need2dp?2:null})]);
      }
      if(marksTotal===3){
        const people = rng.choice([3,4,5,6,8,10,12]);
        const each = rng.int(6,25);
        const total = people*each;
        return Q([partInteger("n8_3", `A total of <b>${total}</b> sweets is shared equally between <b>${people}</b> people. How many sweets does each person get? <span class="endmark">[3]</span>`, 3, each)]);
      }
            if(marksTotal===4){
        const items = rng.choice([8,10,12,15,16,18,20,24]);
        const perPence = rng.choice([5,10,12,15,20,25,30,40,50]);
        const totalPence = items * perPence;
        const otherItems = rng.choice([5,6,8,10,12,15,18,20]);

        if(!isCalc){
          return Q([
            partInteger("n8_4a", `A box contains <b>${items}</b> items and costs <b>${totalPence} pence</b>.<br>
              Work out the cost per item in <b>pence</b>. <span class="endmark">[2]</span>`, 2, perPence),
            partInteger("n8_4b", `How much do <b>${otherItems}</b> items cost (in pence)? <span class="endmark">[2]</span>`, 2, otherItems*perPence),
          ]);
        }

        const total = roundTo(totalPence/100,2);
        return Q([
          partNumber("n8_4a", `A box contains <b>${items}</b> items and costs <b>£${total.toFixed(2)}</b>.<br>Work out the cost per item (£). Give your answer to <b>2 decimal places</b>. <span class="endmark">[2]</span>`,2, roundTo(total/items,2)),
          partNumber("n8_4b", `How much do <b>${otherItems}</b> items cost (£)? Give your answer to <b>2 decimal places</b>. <span class="endmark">[2]</span>`,2, roundTo(otherItems*total/items,2)),
        ]);
      }

// 5 marks: division in context (NOT speed/pressure/density)
      const cap = rng.choice(isCalc ? [28,32,36,40,45,50,52,56] : [24,28,30,32,36,40]);
      const groups = rng.int(isCalc?7:4, isCalc?18:10);
      const remainder = rng.int(1, cap-1);
      const people = cap*groups + remainder;
      const coaches = Math.ceil(people/cap);
      const spare = coaches*cap - people;
      return Q([
        partInteger("n8_5a", `There are <b>${people}</b> people going on a trip. Each coach can carry <b>${cap}</b> people. Work out the <b>minimum number of coaches</b> needed. <span class="endmark">[3]</span>`, 3, coaches),
        partInteger("n8_5b", `If <b>${coaches}</b> coaches are used, how many <b>empty seats</b> will there be? <span class="endmark">[2]</span>`, 2, spare)
      ]);
    }
    case "N9": {
      if(marksTotal===1){
        const a=rng.int(-20,20), b=rng.int(-20,20);
        return Q([partInteger("n9_1", `Work out: <b>${a} − (${b})</b>. <span class="endmark">[1]</span>`, 1, a-b)]);
      }
      if(marksTotal===2){
        const a=rng.int(-30,30), b=rng.int(-30,30), c=rng.int(-15,15);
        return Q([
          partInteger("n9_2a", `Work out: <b>${a} + (${b})</b>. <span class="endmark">[1]</span>`, 1, a+b),
          partInteger("n9_2b", `Work out: <b>${a} + (${b}) − (${c})</b>. <span class="endmark">[1]</span>`, 1, a+b-c),
        ]);
      }
      if(marksTotal===3){
        const a=rng.int(-20,20), b=rng.int(-9,9), c=rng.int(-9,9);
        const ans = a + b*c;
        return Q([partInteger("n9_3", `Work out: <b>${a} + ${b} × ${c}</b>. <span class="endmark">[3]</span>`, 3, ans)]);
      }
      if(marksTotal===4){
        const a=rng.int(-12,12), b=rng.int(-12,12), c=rng.int(2,8), d=rng.int(-9,9);
        const ans = (a-b)*c + d;
        return Q([partInteger("n9_4", `Work out: <b>(${a} − ${b}) × ${c} + (${d})</b>. <span class="endmark">[4]</span>`, 4, ans)]);
      }
      // 5 marks: two linked negative steps, mark structure
      const start=rng.int(-50,50);
      const change1=rng.int(-30,30);
      const change2=rng.int(-30,30);
      const final = start + change1 - change2;
      return Q([
        partInteger("n9_5a", `Start at <b>${start}</b>. Add <b>${change1}</b>. Work out the result <span class="endmark">[2]</span>`, 2, start+change1),
        partInteger("n9_5b", `Now subtract <b>${change2}</b>. Work out the final result <span class="endmark">[3]</span>`, 3, final),
      ]);
    }

    /* ===================== N10 BIDMAS ===================== */
    case "N10": {
      const friendly = (min,max)=> rng.int(min,max);
      if(marksTotal===1){
        const a=friendly(2,15), b=friendly(2,15), c=friendly(2,9);
        return Q([partInteger("n10_1", `Work out: <b>${a} + ${b} × ${c}</b>. <span class="endmark">[1]</span>`, 1, a + b*c)]);
      }
      if(marksTotal===2){
        const a=friendly(2,15), b=friendly(2,15), c=friendly(2,9);
        return Q([partInteger("n10_2", `Work out: <b>(${a} + ${b}) × ${c}</b>. <span class="endmark">[2]</span>`, 2, (a+b)*c)]);
      }
      if(marksTotal===3){
        const a=friendly(2,9), b=friendly(2,9), c=friendly(2,12);
        const ans = a*a + b*b - c;
        return Q([partInteger("n10_3", `Work out: <b>${msup(a,2)} + ${msup(b,2)} − ${c}</b>. <span class="endmark">[3]</span>`, 3, ans)]);
      }
      if(marksTotal===4){
        const a=friendly(2,12), b=friendly(2,12), c=friendly(2,12), d=friendly(2,12);
        const ans = a + b*(c-d);
        return Q([partInteger("n10_4", `Work out: <b>${a} + ${b} × (${c} − ${d})</b>. <span class="endmark">[4]</span>`, 4, ans)]);
      }
      // 5 marks: two expressions then compare
      const a=friendly(2,9), b=friendly(2,9), c=friendly(2,9);
      const d=friendly(2,9), e=friendly(2,9), f=friendly(2,9);
      const v1 = (a+b)*c;
      const v2 = d + e*f;
      const cmp = v1>v2 ? 1 : (v2>v1 ? 2 : 0);
      return Q([
        partInteger("n10_5a", `Work out: <b>(${a} + ${b}) × ${c}</b>. <span class="endmark">[2]</span>`, 2, v1),
        partInteger("n10_5b", `Work out: <b>${d} + ${e} × ${f}</b>. <span class="endmark">[2]</span>`, 2, v2),
        partInteger("n10_5c", `Write <b>1</b> if the first answer is larger, <b>2</b> if the second is larger, or <b>0</b> if equal. <span class="endmark">[1]</span>`, 1, cmp),
      ]);
    }

    /* ===================== N11 Inverse operations / missing number ===================== */
    case "N11": {
      if(marksTotal===1){
        const b = rng.choice([2,3,4,5,6,8,10,12]);
        const x = rng.int(4,30);
        return Q([partInteger("n11_1", `Work out: <b>${b*x} ÷ ${b}</b>. <span class="endmark">[1]</span>`, 1, x)]);
      }
      if(marksTotal===2){
        const op = rng.choice(["+","-","×"]);
        const a = rng.int(15,80), b = rng.int(2,15);
        let ans, expr;
        if(op==="+"){ ans = a-b; expr = `x + ${b} = ${a}`; }
        if(op==="-"){ ans = a+b; expr = `x − ${b} = ${a}`; }
        if(op==="×"){ ans = Math.floor(a/b); expr = `x × ${b} = ${b*ans}`; }
        return Q([partInteger("n11_2", `Find <b>x</b>: <b>${expr}</b>. <span class="endmark">[2]</span>`, 2, ans)]);
      }
      if(marksTotal===3){
        const x = rng.int(10,50);
        const m = rng.int(3,9);

            const D = lcm(lcm(f1.d, f2.d), f3.d);
            const N = f1.n*(D/f1.d) + f2.n*(D/f2.d) + f3.n*(D/f3.d);

              const tokens = new Set(frs.map(f=>`${f.n}/${f.d}`));
              if(tokens.size < 4) continue;
              sum = sumMany(frs);
              if(sum.n < sum.d) break;

            if(!sum){
              frs = [{n:1,d:4},{n:1,d:6},{n:1,d:8},{n:1,d:12}];

              frs = [randProperFrac(bigDen, rng), randProperFrac(bigDen, rng), randProperFrac(bigDen, rng)];
              const tokens = new Set(frs.map(f=>`${f.n}/${f.d}`));

    case "N23": {

                const question =

              const ans = simpFrac(N, D);
              const question =
                `A full tank is <b>1</b> whole. ${mfrac(f2.n,f2.d)} of the tank is used, then another ${mfrac(f3.n,f3.d)} is used.<br>`+

              parts.push(partFraction(id, question, 5, ans));

          for(let t=0;t<2000;t++){

            f1 = randProperFrac(denoms, rng);
            f2 = randProperFrac(denoms, rng);
          }

          const D = lcm(f1.d, f2.d);
          const N = f1.n*(D/f1.d) - f2.n*(D/f2.d);
          const diff = simpFrac(N, D);

          if(m===1){
            parts.push(partFraction(
              `n23_${idx}`,
              `Work out ${mfrac(f1.n,f1.d)} - ${mfrac(f2.n,f2.d)}. <span class="endmark">[1]</span>`,

    case "N24": {

            // 5 marks

    case "N27": {

    /* ===================== N28 Fraction → decimal (terminating) ===================== */

/* ===================== N29 Decimal → Fraction (terminating) ===================== */

      ]);

    case "N31": {
      // Ordering fractions
      const denoms = [3,4,5,6,8,9,10,12];

      const makeFracSet = (count)=>{
        const frs = [];
        const seen = new Set();
        let guard = 0;
        while(frs.length < count && guard < 8000){
          guard++;
          const f = randProperFrac(denoms, rng); // {n,d} simplified
          const token = `${f.n}/${f.d}`;
          if(seen.has(token)) continue;
          seen.add(token);
          frs.push({n:f.n, d:f.d, token, val: f.n/f.d});
        }
        return frs;
      };

      const orderBoxes = (key, fracs)=>`
        <div class="drag-order" data-drag-order="${key}">
          <input type="hidden" id="${key}" value="" />
          <div class="drag-bank" aria-label="Fraction tiles">
            ${fracs.map(f=>`<span class="dragbox" draggable="true" data-token="${f.token}">${mfrac(f.n,f.d)}</span>`).join("")}
          </div>
          <div class="drag-targets" aria-label="Order from smallest to largest">

          </div>
          <div class="drag-instr">
            Drag the boxes into the empty spaces to show the order from <b>smallest</b> to <b>largest</b>.
          </div>
        </div>
      `;

      const rangeFrac = (small, large)=>{
        const D = lcm(small.d, large.d);
        const N = large.n*(D/large.d) - small.n*(D/small.d);
        return simpFrac(N, D);
      };

      const sumFrac = (a, b)=>{
        const D = lcm(a.d, b.d);
        const N = a.n*(D/a.d) + b.n*(D/b.d);
        return simpFrac(N, D);
      };

      const oneMinus = (f)=>{
        const N = f.d - f.n;
        return simpFrac(N, f.d);

      // =========================================================
      // 1 MARK — Compare two fractions
      // =========================================================
      if(marksTotal===1){

          if(!noExpZero(val)) continue;
          return Q([partStdForm("n39_2", `Work out <b>(${sf(A1,n1)}) ÷ (${sf(A2,n2)})</b>.<br>Give your answer in standard form. <span class="endmark">[2]</span>`, 2, val)]);

      }

      if(marksTotal===3){

          const n1 = rng.choice([-6,-5,-4,-3,-2,-1,1,2,3,4,5]);
          const n2 = rng.choice([-6,-5,-4,-3,-2,-1,1,2,3,4,5]);
          const A1 = rng.int(12,90)/10;
          const A2 = rng.int(12,90)/10;
          const coeff = A1/A2;
          // force normalisation (coeff <1 or >=10)
          if(coeff>=1 && coeff<10) continue;
          const val = (A1*Math.pow(10,n1))/(A2*Math.pow(10,n2));
          if(!noExpZero(val)) continue;
          return Q([partStdForm("n39_3", `Work out <b>(${sf(A1,n1)}) ÷ (${sf(A2,n2)})</b>.<br>Give your answer in standard form. <span class="endmark">[3]</span>`, 3, val)]);
        }

      if(marksTotal===4){
        while(true){
          const totalA = rng.int(12,98)/10;
          const totalN = rng.choice([3,4,5,6,7,8]); // not 0

        const boxMass = each*(massA*Math.pow(10,massN));
        if(!noExpZero(boxMass)) continue;

        return Q([
          partStdForm("n39_5a", `A factory makes <b>(${sf(totalA,totalN)})</b> screws.<br>
            They are packed equally into <b>${boxes}</b> boxes.<br>
            Work out how many screws are in each box, in standard form. <span class="endmark">[3]</span>`, 3, each),
          partStdForm("n39_5b", `The mass of one screw is <b>(${sf(massA,massN)}) kg</b>.<br>

    case "N40": {

      const b = isCalc ? (rng.int(120,980)/10) : rng.int(12,98);

      const ea = Number(a.toPrecision(1));
      const eb = Number(b.toPrecision(1));
      const est = op==="×" ? ea*eb : ea/eb;
      if(marksTotal===1){
        return Q([partNumber("n40_1", `Round <b>${a}</b> to 1 significant figure. <span class="endmark">[1]</span>`, 1, ea)]);
      }
      if(marksTotal===2){
        return Q([partNumber("n40_2", `Estimate <b>${a} ${op} ${b}</b> by rounding each number to 1 significant figure first. <span class="endmark">[2]</span>`, 2, est)]);
      }
      if(marksTotal===3){
        const exact = op==="×" ? a*b : a/b;
        const pctErr = Math.abs(est-exact)/Math.abs(exact)*100;
        return Q([
          partNumber("n40_3a", `Estimate <b>${a} ${op} ${b}</b> by rounding to 1 s.f. first. <span class="endmark">[2]</span>`, 2, est),
          partNumber("n40_3b", `Percentage error (to 1 d.p.) <span class="endmark">[1]</span>`, 1, roundTo(pctErr,1)),
        ]);
      }
      if(marksTotal===4){
        const exact = op==="×" ? a*b : a/b;
        const absErr = Math.abs(est-exact);
        return Q([
          partNumber("n40_4a", `Estimate <b>${a} ${op} ${b}</b> by rounding to 1 s.f. first. <span class="endmark">[2]</span>`, 2, est),
          partNumber("n40_4b", `Work out the absolute error |estimate − exact| (to 2 d.p.) <span class="endmark">[2]</span>`, 2, roundTo(absErr,2)),
        ]);
      }
      // 5 marks: estimation + check by comparing bounds
      const exact = op==="×" ? a*b : a/b;
      const bigger = exact>est ? 1 : (est>exact ? 2 : 0);
      return Q([
        partNumber("n40_5a", `Estimate <b>${a} ${op} ${b}</b> by rounding to 1 s.f. first. <span class="endmark">[2]</span>`, 2, est),
        partNumber("n40_5b", `Work out the exact value. (calculator allowed if selected) <span class="endmark">[2]</span>`, 2, roundTo(exact,6)),
        partInteger("n40_5c", `Write <b>1</b> if the exact value is larger, <b>2</b> if the estimate is larger, or <b>0</b> if equal. <span class="endmark">[1]</span>`, 1, bigger),
      ]);
    }

    /* ===================== N41 Rounding (dp) ===================== */
    
    case "N41": {
      // Rounding to decimal places
      if(!isCalc){
        // NON-CALCULATOR: round to 0 decimal places so the answer is a whole number
        const parts=[];
        for(let i=1;i<=marksTotal;i++){
          const whole = rng.int(10, 999);
          const frac = rng.choice([0.12,0.18,0.23,0.27,0.31,0.36,0.41,0.48,0.52,0.57,0.63,0.69,0.74,0.78,0.81,0.86,0.92]);
          const x = roundTo(whole + frac, 2);
          const ans = Math.round(x);
          parts.push(partInteger(`n41_${marksTotal}_${i}`, `Round <b>${x.toFixed(2)}</b> to the nearest <b>whole number</b>. <span class="endmark">[1]</span>`, 1, ans));
        }
        return Q(parts);
      }

      // CALCULATOR: round to 1–3 decimal places
      const parts=[];
      const dp = rng.choice([1,2,3]);
      function makeDec(totalDp){
        const m = 10**totalDp;
        let n;
        while(true){
          n = rng.int(1*m, 999*m);
          // ensure the last digit isn't 0 so rounding isn't always trivial
          if(n % 10 !== 0) break;
        }
        return n/m;
      }
      for(let i=1;i<=marksTotal;i++){
        const x = makeDec(dp+1);
        const ans = roundTo(x, dp);
        parts.push(partNumber(`n41c_${marksTotal}_${i}`, `Round <b>${fmt(x, dp+1)}</b> to <b>${dp}</b> decimal place(s). <span class="endmark">[1]</span>`, 1, ans));
      }
      return Q(parts);
    }

    case "N42": {
      const parts=[];
      for(let i=1;i<=marksTotal;i++){
        const sf = rng.choice([1,2,3,4]);
        const n = rng.int(120, 9800000);

        parts.push(partNumber(`n42_${marksTotal}_${i}`, `Round <b>${n}</b> to <b>${sf}</b> significant figure(s). <span class="endmark">[1]</span>`, 1, ans));
      }
      return Q(parts);

    /* ===================== N43 Error intervals (bounds) ===================== */
    /* ===================== N43 Error intervals (bounds) ===================== */
    case "N43": {

      const makeNonCalc = ()=>{
        // use nearest 10 / 100 so bounds are whole numbers
        const unit = rng.choice([10, 100]);
        const x = rng.int(12, 98) * unit; // e.g. 340, 5600
        const half = unit/2; // 5 or 50
        const low = x - half;
        const high = x + half;
        return {x, unit, half, low, high};

      const makeCalc = ()=>{

        const half = unit/2;
        const low = roundTo(x - half, 6);
        const high = roundTo(x + half, 6);
        return {x, unit, half, low, high};
      };

      const d = isCalc ? makeCalc() : makeNonCalc();
      const unitTxt = isCalc
        ? (d.unit===0.1 ? "1 decimal place" : "2 decimal places")
        : `the nearest <b>${d.unit}</b>`;

      const shown = isCalc
        ? (d.unit===0.1 ? d.x.toFixed(1) : d.x.toFixed(2))

      if(marksTotal===1){
        return Q([
          partNumber("n43_1", `A measurement is <b>${shown}</b> correct to ${unitTxt}.<br>
            Write the <b>lower bound</b>. <span class="endmark">[1]</span>`, 1, d.low)
        ]);

      if(marksTotal===2){

          partPair("n43_2", `A measurement is <b>${shown}</b> correct to ${unitTxt}.<br>

          partNumber("n43_3b", `What is the <b>maximum possible error</b>? <span class="endmark">[1]</span>`, 1, d.half),

        const mid = roundTo((d.high + d.low)/2, 6);
        return Q([
          partPair("n43_4a", `A measurement is <b>${shown}</b> correct to ${unitTxt}.<br>
            Give the lower and upper bounds. <span class="endmark">[2]</span>`, 2, [d.low, d.high], {placeholders:["lower","upper"], labels:["Lower","Upper"]}),
          partNumber("n43_4b", `Work out the <b>width</b> of the interval (upper − lower). <span class="endmark">[1]</span>`, 1, width),
          partNumber("n43_4c", `Work out the <b>midpoint</b> of the interval. <span class="endmark">[1]</span>`, 1, mid),

      // 5 marks: bounds for two rounded values + compare intervals
      while(true){
        const a = isCalc ? makeCalc() : makeNonCalc();
        const b = isCalc ? makeCalc() : makeNonCalc();

        const aShown = isCalc ? (a.unit===0.1 ? a.x.toFixed(1) : a.x.toFixed(2)) : String(a.x);
        const bShown = isCalc ? (b.unit===0.1 ? b.x.toFixed(1) : b.x.toFixed(2)) : String(b.x);

        const aUnitTxt = isCalc ? (a.unit===0.1 ? "1 decimal place" : "2 decimal places") : `the nearest <b>${a.unit}</b>`;
        const bUnitTxt = isCalc ? (b.unit===0.1 ? "1 decimal place" : "2 decimal places") : `the nearest <b>${b.unit}</b>`;

        // Is it possible that true a > true b ?
        const possible = (a.high > b.low) ? 1 : 0;

        // Encourage variation: sometimes "yes", sometimes "no"
        if(possible===1 && rng.float()<0.6) continue;
        if(possible===0 && rng.float()<0.6) continue;

        return Q([
          partPair("n43_5a", `a = <b>${aShown}</b> correct to ${aUnitTxt}.<br>Give bounds for a. <span class="endmark">[2]</span>`, 2, [a.low, a.high], {placeholders:["lower","upper"], labels:["Lower","Upper"]}),

          partInteger("n43_5c", `Is it possible that the <b>true value of a</b> is greater than the <b>true value of b</b>?<br>

    case "N44": {

          let A1 = roundTo(rng.int(40,99)/10,1);
          let A2 = roundTo(rng.int(12,90)/10,1);
          let A3 = roundTo(rng.int(12,90)/10,1);
          const val = (A1*Math.pow(10,n)) - (A2*Math.pow(10,n)) - (A3*Math.pow(10,n-1));
          if(val<=0) continue;
          if(!noExpZero(val)) continue;
          return Q([partStdForm("n50_4", `Work out <b>(${sf(A1,n)}) − (${sf(A2,n)}) − (${sf(A3,n-1)})</b>.<br>Give your answer in standard form. <span class="endmark">[4]</span>`, 4, val)]);
        }
      }

      // 5 marks – context (still pure subtraction in standard form)
      while(true){
        const stockA = rng.int(12,90)/10;
        const stockN = rng.choice([6,7,8]); // not 0
        const usedA = rng.int(12,90)/10;
        // used has a smaller exponent (different place value)
        const usedN = stockN - 1;

        const stock = stockA*Math.pow(10,stockN);
        const used = usedA*Math.pow(10,usedN);
        const remaining = stock - used;
        if(remaining<=0) continue;
        if(!noExpZero(remaining)) continue;

        return Q([
          partStdForm("n50_5", `A warehouse has <b>(${sf(stockA,stockN)})</b> items in stock.<br>
            It uses <b>(${sf(usedA,usedN)})</b> items.<br>
            Work out how many items are left in stock. Give your answer in standard form. <span class="endmark">[5]</span>`, 5, remaining)
        ]);
      }
    }



    default:
      return Q([partNumber("x", `Not implemented. <span class="endmark">[${marksTotal}]</span>`, marksTotal, 0)]);
  }
}
